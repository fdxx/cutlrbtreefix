name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Enter version'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        sm_version: ["1.11", "1.12", "latest"]
        os: [windows-2022, ubuntu-latest]
        include:
          - os: windows-2022
            os_short: windows

          - os: ubuntu-latest
            os_short: linux
            container_image: debian:11

          - sm_version: "1.11"
            sm_branch: "1.11-dev"

          - sm_version: "1.12"
            sm_branch: "1.12-dev"
          
          - sm_version: "latest"
            sm_branch: "master"

    name: build with sm${{ matrix.sm_version }} on ${{ matrix.os_short }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container_image }}

    steps:
      - name: Getting GITHUB_SHA_SHORT
        shell: bash
        run: |
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Install linux dependencies
        if: ${{ matrix.os_short == 'linux' }}
        shell: bash
        run: |
          apt update && apt install -y apt-transport-https lsb-release wget curl software-properties-common gnupg g++-multilib git make zip
          bash <(curl -fsSL https://apt.llvm.org/llvm.sh) 18
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "XMAKE_ROOT=y" >> $GITHUB_ENV

      - name: Getting xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          
      - name: Getting SourceMod ${{ matrix.sm_version }}
        uses: actions/checkout@v6
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ matrix.sm_branch }}
          path: sourcemod-${{ matrix.sm_version }}
          submodules: recursive
      
      - name: Getting hl2sdk-l4d2
        uses: actions/checkout@v6
        with:
          repository: alliedmodders/hl2sdk
          ref: l4d2
          path: hl2sdk-l4d2

      - name: Getting hl2sdk-l4d
        uses: actions/checkout@v6
        with:
          repository: alliedmodders/hl2sdk
          ref: l4d
          path: hl2sdk-l4d
          
      - name: Getting safetyhook
        uses: actions/checkout@v6
        with:
          repository: alliedmodders/safetyhook
          ref: main
          path: safetyhook

      - name: Getting own repository
        uses: actions/checkout@v6
        with:
          path: src

      - name: Compile ${{ github.event.repository.name }}
        working-directory: src
        run: |
          xmake f -c --SMPATH=../sourcemod-${{ matrix.sm_version }} --HL2SDKPATH=../hl2sdk-l4d2 --HL2SDKNAME=l4d2 --SAFETYHOOKPATH=../safetyhook
          xmake -rv cutlrbtreefix
          xmake f -c --SMPATH=../sourcemod-${{ matrix.sm_version }} --HL2SDKPATH=../hl2sdk-l4d --HL2SDKNAME=l4d --SAFETYHOOKPATH=../safetyhook
          xmake -rv cutlrbtreefix

      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          directory: src/release
          filename: "../${{ github.event.repository.name }}-sm${{ matrix.sm_version }}-${{ matrix.os_short }}-${{ env.GITHUB_SHA_SHORT }}.zip"
          
      - name: Uploading package
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: src/${{ github.event.repository.name }}-sm${{ matrix.sm_version }}-${{ matrix.os_short }}-${{ env.GITHUB_SHA_SHORT }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
